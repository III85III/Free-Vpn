name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Desktop checks
        shell: pwsh
        run: .\tools\test.ps1
      - name: Synthetic BAT proxy behavior
        shell: pwsh
        run: python -I tools/test-bot-proxy.py
