name: Mobile builds
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, android, ios]
        default: all
      android_test_run:
        description: Existing Android test artifact run (optional; device checks only)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  android:
    if: inputs.platform != 'ios' && inputs.android_test_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android native tools
        run: |
          yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' >/dev/null || test -d "$ANDROID_HOME/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Engine binding tools
        run: |
          go -C core install golang.org/x/mobile/cmd/gomobile
          go -C core install golang.org/x/mobile/cmd/gobind
          gomobile init
      - name: Android engine
        working-directory: core
        env:
          CGO_LDFLAGS: '-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384'
        run: |
          mkdir -p ../mobile/android/app/libs
          gomobile bind -target=android/arm64,android/amd64 -androidapi 26 -trimpath -ldflags='-s -w -X github.com/III85III/III85III-VPN/core/internal/version.Current=2.2.0' -o ../mobile/android/app/libs/core.aar ./mobile
      - name: Dependency notices
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '1'
        run: |
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          python3 tools/mobile-licenses.py --module core/mobile --output mobile/android/app/src/main/assets/licenses
      - name: APK and lint
        run: |
          chmod +x mobile/android/gradlew
          mobile/android/gradlew -p mobile/android --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease :probe:assembleDebug
          mkdir -p .build/android-qa
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk .build/android-qa/app-debug.apk
          cp mobile/android/probe/build/outputs/apk/debug/probe-debug.apk .build/android-qa/probe.apk
          mobile/android/gradlew -p mobile/android --no-daemon :app:assembleDebug -PversionCodeOverride=23002 -PversionNameOverride=2.3.1-qa-update
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk .build/android-qa/upgrade.apk
      - uses: actions/upload-artifact@v4
        if: inputs.platform != 'ios'
        with:
          name: III85III-VPN-Android-test
          path: .build/android-qa/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: III85III-VPN-Android-unsigned
          path: mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
  android-device:
    if: always() && inputs.platform != 'ios' && (needs.android.result == 'success' || inputs.android_test_run != '')
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: III85III-VPN-Android-test
          path: .build/android-qa
          run-id: ${{ inputs.android_test_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Native emulator startup check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          script: python3 tools/check-android-emulator.py --apk .build/android-qa/app-debug.apk --upgrade .build/android-qa/upgrade.apk --output test-results/android-${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-UI-${{ matrix.api }}
          path: test-results/android-${{ matrix.api }}
          if-no-files-found: ignore
          retention-days: 14
  ios:
    if: inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: mobile/apple-engine/go.sum
      - name: Packet adapter tests
        run: go -C mobile/apple-engine test -timeout=60s ./...
      - name: Apple framework tools
        run: |
          go -C mobile/apple-engine install golang.org/x/mobile/cmd/gomobile
          go -C mobile/apple-engine install golang.org/x/mobile/cmd/gobind
          gomobile init
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Apple engine framework
        working-directory: mobile/apple-engine
        run: |
          mkdir -p ../ios/Frameworks
          gomobile bind -target=ios,iossimulator -iosversion=15.0 -trimpath -ldflags='-s -w -X github.com/III85III/III85III-VPN/core/internal/version.Current=2.2.0' -o ../ios/Frameworks/III85IIICore.xcframework .
      - name: Apple dependency notices
        run: python3 tools/mobile-licenses.py --module mobile/apple-engine --output mobile/ios/App/Licenses
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Unsigned simulator and device builds
        working-directory: mobile/ios
        run: |
          xcodebuild -project 'III85III VPN.xcodeproj' -scheme 'III85III VPN' -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios-simulator" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ios-simulator.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ios-simulator.log"; exit 1; }
          xcodebuild -project 'III85III VPN.xcodeproj' -scheme 'III85III VPN' -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios-device" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ios-device.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ios-device.log"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ios-package/Payload" build
          ditto "$RUNNER_TEMP/ios-device/Build/Products/Release-iphoneos/III85IIIVPN.app" "$RUNNER_TEMP/ios-package/Payload/III85III VPN.app"
          cd "$RUNNER_TEMP/ios-package"
          zip -qr "$GITHUB_WORKSPACE/mobile/ios/build/III85III-VPN-iOS-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: III85III-VPN-iOS-unsigned
          path: mobile/ios/build/III85III-VPN-iOS-unsigned.ipa
          retention-days: 14
